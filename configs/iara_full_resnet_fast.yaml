project:
  name: iara_full_resnet_fast
  output_dir: runs/iara_resnet_full_fast
  seed: 20260626

data:
  manifest_csv: data/iara_full_manifests/iara_full_1825_splits.csv
  split_column: split
  path_column: audio_path
  target_column: target
  recording_id_column: recording_id

  sample_rate: 16000
  segment_seconds: 10.0
  hop_seconds: 10.0
  min_segment_seconds: 2.0

  n_fft: 1024
  hop_length: 512
  win_length: 1024
  n_mels: 64
  f_min: 10.0
  f_max: 8000.0

  batch_size: 16
  num_workers: 2
  pin_memory: false

augmentation:
  enabled: true
  random_gain_db: 3.0
  gaussian_noise_snr_db_min: 10.0
  gaussian_noise_snr_db_max: 30.0
  noise_probability: 0.2
  time_mask_probability: 0.15
  time_mask_fraction: 0.08
  freq_mask_probability: 0.15
  freq_mask_bins: 6

model:
  type: resnet
  n_mels: 64
  base_channels: 24
  blocks_per_stage: 2
  dropout: 0.1
  num_binary_outputs: 1

training:
  epochs: 8
  learning_rate: 0.0003
  weight_decay: 0.000001
  grad_clip: 1.0
  amp: false
  pos_weight: auto
  threshold: 0.5
  early_stop_patience: 4
  monitor: val_balanced_accuracy
  monitor_mode: max
  size_loss_weight: 0.0
